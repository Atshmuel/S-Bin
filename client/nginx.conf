# Where pages may load from, for both sites. Report-only for now: the browser
# blocks nothing and posts each violation to /api/csp-report, which logs it.
# Styles stay 'unsafe-inline' (React style props, the charts' and toasts'
# style tags); the map tiles come from OpenStreetMap and ArcGIS; the landing
# page calls the app's API.
# Text goes out compressed (the app's script is about 2 MB, 600 KB gzipped),
# API replies through the proxy included.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/csv application/javascript application/json application/xml image/svg+xml model/gltf-binary;

map $host $content_security_policy {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self' data: blob: https://app.s-bins.duckdns.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri https://app.s-bins.duckdns.org/api/csp-report";
}

server {
    listen 80;
    server_name s-bins.duckdns.org www.s-bins.duckdns.org app.s-bins.duckdns.org;

    # קריטי: לאפשר ל-Certbot לגשת לקבצי האימות דרך HTTP רגיל
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # כל שאר הבקשות יופנו ל-HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# The landing page: https://s-bins.duckdns.org. It is the same build as the app
# (the client picks the landing page by host), so only its own files are served
# here; every other path, such as an old bookmark or an emailed link, goes to the app.
server {
    listen 443 ssl;
    server_name s-bins.duckdns.org www.s-bins.duckdns.org;
    server_tokens off;

    # Security headers (repeated in the location with its own add_header, see the app's server).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only $content_security_policy always;

    ssl_certificate /etc/letsencrypt/live/s-bins.duckdns.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s-bins.duckdns.org-0001/privkey.pem;

    if ($host = www.s-bins.duckdns.org) {
        return 301 https://s-bins.duckdns.org$request_uri;
    }

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only $content_security_policy always;
    }

    location ~ ^/(assets|models|images)/ {
        root /usr/share/nginx/html;
        expires 7d;
    }

    location = /favicon.png {
        root /usr/share/nginx/html;
    }

    location /.well-known/acme-challenge/ {
        alias /var/www/html/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    location / {
        return 301 https://app.s-bins.duckdns.org$request_uri;
    }
}

# The app: https://app.s-bins.duckdns.org
server {
    listen 443 ssl;
    server_name app.s-bins.duckdns.org;
    server_tokens off;

    # Security headers. nginx drops the server's add_header lines in a location
    # that has add_header lines of its own, so those locations repeat them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only $content_security_policy always;

    ssl_certificate /etc/letsencrypt/live/s-bins.duckdns.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s-bins.duckdns.org-0001/privkey.pem;

    # Serve React build. index.html is never reused without asking the server
    # first, so a visitor gets the new build (and the landing page on the bare
    # domain) instead of an old copy their browser kept; the hashed files under
    # /assets are safe to keep.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only $content_security_policy always;
    }

    # Their names carry a hash of their content, so a file never changes.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only $content_security_policy always;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://sbin-server:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Without these the app only ever sees the nginx container's IP, so the
        # rate limiters would throttle all users collectively instead of per client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 480s;
        proxy_send_timeout    480s;
        proxy_read_timeout    480s;
        send_timeout          480s;
    }

    # Certbot challenge (לרענון)
    location /.well-known/acme-challenge/ {
        alias /var/www/html/.well-known/acme-challenge/;
        try_files $uri =404;
    }
}
