name: CI/CD - Build & Deploy S-Bin

on:
  push:
    branches:
      - master-main

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------
      # Build & Push SERVER
      # --------------------
      - name: Build & Push Server Image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sbin-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sbin-server:${{ github.sha }}

      # --------------------
      # Build & Push CLIENT
      # --------------------
      - name: Build & Push Client Image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
              VITE_API_URL=https://app.s-bins.duckdns.org
              VITE_APP_URL=https://app.s-bins.duckdns.org
              VITE_LANDING_HOST=s-bins.duckdns.org
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sbin-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sbin-client:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy docker-compose, nginx, the routing and the broker setup to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}

          source: "docker-compose.yml,client/nginx.conf,routing/vroom-conf/config.yml,routing/prepare-osrm.sh,mosquitto/mosquitto.conf,mosquitto/setup.sh,mosquitto/sync-certs.sh" 
          target: "~/s-bin"
          strip_components: 0 

      - name: Deploy on Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/s-bin

            ls -la

            echo "Logging into Docker Hub..."
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            # Only the app's own images change from deploy to deploy; OSRM and
            # VROOM keep running (recreating them reloads the road graph and
            # changes VROOM's container IP).
            echo "Pulling the app images..."
            docker compose pull server client

            echo "Restarting the app containers..."
            docker compose up -d --force-recreate server client

            # Starts OSRM or VROOM only if one is down or its definition in
            # docker-compose.yml changed; a running, unchanged one is left alone.
            echo "Making sure the routing containers run..."
            docker compose up -d

            # Each pull leaves the previous :latest images behind as <none>.
            echo "Removing old images..."
            docker image prune -f

            echo "Deployment completed successfully"
